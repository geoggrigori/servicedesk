[project]
name = "servicedesk"
version = "1.0.0"
description = "Ticketing API with business-hours SLA tracking, built with Django and DRF."
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "DJ", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "tickets"]
